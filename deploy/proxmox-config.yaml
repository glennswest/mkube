# mkube config for Proxmox VE backend (cluster member)
# Deploy on the Proxmox host or a container with API access.

nodeName: pvex
standalone: true
backend: proxmox

proxmox:
  url: "https://pvex.gw.lo:8006"
  tokenID: "mkube@pve!mkube-token"
  tokenSecret: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
  node: "pvex"
  insecureVerify: true
  vmidRange: "200-299"
  storage: "local"
  rootfsStorage: "local-lvm"
  rootfsSize: "8"
  unprivileged: true
  features: "nesting=1"

networks:
  - name: gw
    bridge: vmbr0
    cidr: "192.168.1.0/24"
    gateway: "192.168.1.1"
    dns:
      endpoint: "http://192.168.1.252:8080"
      zone: "gw.lo"
      server: "192.168.1.252"

storage:
  basePath: "/var/lib/mkube/images"
  tarballCache: "/var/lib/mkube/cache"
  gcIntervalMinutes: 30
  gcKeepLastN: 5

lifecycle:
  bootManifestPath: "/etc/mkube/boot-order.yaml"
  watchdogIntervalSeconds: 10
  maxRestarts: 5
  restartCooldown: 10
  # Exponential backoff cap between restart attempts (seconds).
  restartBackoffMax: 300
  # Pod recreates allowed after the restart budget is exhausted, before the
  # container is left failed instead of rebuilt forever.
  maxRecreates: 3

nats:
  embedded: true
  storeDir: /var/lib/mkube/nats
  port: 4222
  replicas: 1

cluster:
  enabled: true
  peers:
    - name: rose1
      address: "http://192.168.1.88:8082"
