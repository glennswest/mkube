# mkube configuration for rose1.gw.lo (ROSE Data Server)
# This file is mounted at /etc/mkube/config.yaml inside the container.
#
# The container runs ON the router at 192.168.200.2 and accesses the
# RouterOS REST API at 192.168.200.1 (the bridge gateway).

nodeName: rose1
standalone: true

routeros:
  address: "192.168.200.1:8728"
  restUrl: "http://192.168.200.1/rest"
  user: mkube
  password: "mkube-rest"
  useTLS: false
  # /raid1 bind-mounted into this container: file ops (exists/mkdir/remove/
  # rename/list/du) run on the local filesystem instead of /file print, which
  # enumerates the whole tree server-side (minutes with registry blobs on
  # /raid1). mkube self-ensures the mount entry at boot; it attaches on the
  # next container recreate.
  localFileRoot: "/hostraid1"

# Statically configured networks. Discovery will auto-populate DNS config
# for any of these that lack it, and add new networks found on the device.
networks:
  - name: gt
    bridge: bridge-gt
    cidr: "192.168.200.0/24"
    gateway: "192.168.200.1"
    ipamStart: "192.168.200.100"
    ipamEnd: "192.168.200.200"
    dns:
      endpoint: "http://192.168.200.199:8080"
      zone: "gt.lo"
      server: "192.168.200.199"
      staticRecords:
        - name: rose1
          ip: "192.168.200.1"
        - name: dns
          ip: "192.168.200.199"
        - name: nats
          ip: "192.168.200.10"
        - name: mkube
          ip: "192.168.200.2"
        - name: registry
          ip: "192.168.200.3"
  - name: g8
    type: data
    bridge: bridge-g8
    cidr: "192.168.8.0/24"
    gateway: "192.168.8.1"
    dns:
      endpoint: "http://192.168.8.252:8080"
      zone: "g8.lo"
      server: "192.168.8.252"
      staticRecords:
        - name: rose1
          ip: "192.168.8.1"
        - name: dns
          ip: "192.168.8.252"
      dhcp:
        enabled: true
        rangeStart: "192.168.8.100"
        rangeEnd: "192.168.8.200"
        leaseTime: 86400
  - name: g9
    type: data
    bridge: bridge-g9
    cidr: "192.168.9.0/24"
    gateway: "192.168.9.1"
    dns:
      endpoint: "http://192.168.9.252:8080"
      zone: "g9.lo"
      server: "192.168.9.252"
      staticRecords:
        - name: rose1
          ip: "192.168.9.1"
        - name: dns
          ip: "192.168.9.252"
      dhcp:
        enabled: true
        rangeStart: "192.168.9.100"
        rangeEnd: "192.168.9.200"
        leaseTime: 86400
  - name: g10
    bridge: bridge-g10
    cidr: "192.168.10.0/24"
    gateway: "192.168.10.1"
    ipamStart: "192.168.10.200"
    ipamEnd: "192.168.10.250"
    dns:
      endpoint: "http://192.168.10.252:8080"
      zone: "g10.lo"
      server: "192.168.10.252"
      staticRecords:
        - name: rose1
          ip: "192.168.10.1"
        - name: dns
          ip: "192.168.10.252"
        - name: pxe
          ip: "192.168.10.200"
      dhcp:
        enabled: true
        rangeStart: "192.168.10.100"
        rangeEnd: "192.168.10.199"
        leaseTime: 600
        nextServer: "192.168.10.200"
        bootFile: "undionly.kpxe"
        bootFileEfi: "ipxe.efi"
        # Reservations managed via BMH objects in NATS + microdns REST API
  - name: g11
    type: ipmi
    bridge: bridge-g11
    cidr: "192.168.11.0/24"
    gateway: "192.168.11.1"
    ipamStart: "192.168.11.200"
    ipamEnd: "192.168.11.250"
    dns:
      endpoint: "http://192.168.11.252:8080"
      zone: "g11.lo"
      server: "192.168.11.252"
      staticRecords:
        - name: rose1
          ip: "192.168.11.1"
        - name: dns
          ip: "192.168.11.252"
      dhcp:
        enabled: true
        rangeStart: "192.168.11.150"
        rangeEnd: "192.168.11.180"
        leaseTime: 600
        nextServer: "192.168.10.9"
        bootFile: "pxelinux.0"
        # Reservations managed via BMH objects in NATS + microdns REST API
  # g16 — flat /20 core fabric on dsw1 (g10 physical collapse; see CLAUDE.md).
  # Address plan: infra at the bottom (16.1 gw, 16.2 dsw1, 16.3 switch10);
  # bare-metal hosts from 192.168.16.100 with the whole 16.x–29.x space to grow
  # into (48-port fabric): blades server1–8 as a/b pairs (a = 1G boot NIC w/
  # PXE at even IPs from .100, b = Mellanox 40G, no gateway/PXE, odd IPs),
  # storage server9 (R730xd) at .120. Dynamic DHCP is only 192.168.30.0/24.
  # Services live at the top in 192.168.31.0/24: mkube pod IPAM 31.10–31.199,
  # pxe/bmh-operator 31.200, fastregistry 31.201, DNS 31.252.
  - name: g16
    type: data
    bridge: bridge-g16
    cidr: "192.168.16.0/20"
    gateway: "192.168.16.1"
    ipamStart: "192.168.31.10"
    ipamEnd: "192.168.31.199"
    dns:
      endpoint: "http://192.168.31.252:8080"
      zone: "g16.lo"
      server: "192.168.31.252"
      staticRecords:
        - name: rose1
          ip: "192.168.16.1"
        - name: dns
          ip: "192.168.31.252"
        - name: dsw1
          ip: "192.168.16.2"
        - name: pxe
          ip: "192.168.31.200"
        - name: fastregistry
          ip: "192.168.31.201"
        # Console server (ipmiserial) lives on g11; aliased here for fabric-side use.
        - name: console
          ip: "192.168.11.200"
        - name: ipmiserial
          ip: "192.168.11.200"
      dhcp:
        enabled: true
        rangeStart: "192.168.30.1"
        rangeEnd: "192.168.30.254"
        leaseTime: 600
        # TFTP served by bmh-operator (pxe.g16.lo, 31.200) — fabric-local.
        nextServer: "192.168.31.200"
        bootFile: "undionly.kpxe"
        bootFileEfi: "ipxe.efi"
        # Reservations managed via BMH objects in NATS + microdns REST API
  - name: gw
    bridge: bridge-g1
    cidr: "192.168.1.0/24"
    gateway: "192.168.1.1"
    dns:
      endpoint: "http://192.168.1.252:8080"
      zone: "gw.lo"
      server: "192.168.1.252"
      staticRecords:
        - name: rose1
          ip: "192.168.1.1"
        - name: dns
          ip: "192.168.1.252"

storage:
  basePath: /raid1/images
  tarballCache: /raid1/cache
  # stormblockmk backs `storageClassName: stormblock` PVCs: thin CoW volumes,
  # attached over iSCSI or NVMe-TCP (whichever the export reports) and mounted
  # by RouterOS. The token is a Secret, not a literal — stormblockmk generates
  # one into /data/meta/api-token on first boot, and putting it here would
  # commit a credential to git.
  stormblock:
    endpoint: "http://192.168.200.21:9090"
    tokenSecret: "gt/stormblock-token"   # key: token
    # iSCSI, deliberately — NOT nvme-tcp.
    #
    # RouterOS 7.22.2 ATTACHES an NVMe-TCP target correctly (verified end to
    # end: nqn…@:3304 → slot=nvme-tcp1) but never probes a filesystem on it:
    # after a verified-good ext4 format the disk row still reads `fs=-` and
    # nothing mounts, while the same volume over iSCSI mounts at /iscsiN.
    # Anything mkube has to MOUNT — PVCs, CoW clones — therefore stays on
    # iSCSI. NVMe is the right transport for consumers that mount the device
    # themselves (a bare-metal host, or a container once device passthrough
    # is wired up), not for the router's own mount path.
    transport: "iscsi"
    # template: "ext4-1g"   # clone a pre-formatted fs instead of mkfs per PVC
  selfRootDir: raid1/images/kube.gt.lo
  iscsiPortalIP: "192.168.10.1"
  persistentMounts:
    - containerPath: "/raid1/cache"
      hostPath: "raid1/cache"
    - containerPath: "/raid1/iso"
      hostPath: "raid1/iso"
    - containerPath: "/data"
      hostPath: "raid1/volumes/kube.gt.lo/data"
  gcIntervalMinutes: 60
  gcKeepLastN: 10
  gcDryRun: false

lifecycle:
  bootManifestPath: /etc/mkube/boot-order.yaml
  watchdogIntervalSeconds: 5
  maxRestarts: 5
  restartCooldown: 10

dzo:
  enabled: true
  listenAddr: ":8082"
  statePath: /etc/mkube/dzo-state.yaml
  microdnsImage: "192.168.200.3:5000/microdns:latest"
  defaultMode: "nested"

namespace:
  statePath: /etc/mkube/namespace-state.yaml
  defaultMode: "nested"

logging:
  enabled: true
  url: "http://logging.kube.gt.lo:8084"

nats:
  embedded: true
  storeDir: /data/nats
  port: 4222
  replicas: 1

cluster:
  enabled: true
  peers:
    - name: pvex
      address: "http://192.168.1.160:8082"

console:
  enabled: true
  apiBase: "http://mkube.gt.lo:8082"
  cloudidURL: "http://192.168.200.20:8090"

bmh:
  pxeManagerURL: "http://pxe.g16.lo:8080"
  dhcpLeaseURL: "http://192.168.11.252:8080"
  watchInterval: 30

gitBackup:
  enabled: true
  repoURL: "http://git.gt.lo"
  repoName: "mkube/configstate"
  branch: "main"
  username: "mkube"
  password: "mkube-rest"
  passwordFile: "/data/mkube/git-token"
  intervalSeconds: 300
  debounceSeconds: 30
  commitAuthor: "mkube"
  commitEmail: "mkube@gt.lo"
  dnsSnapshot: true

# Registry runs as a standalone container (mkube-registry) at 192.168.200.3:5000.
# mkube no longer runs the embedded registry — it receives push notifications
# via the webhook endpoint POST /api/v1/registry/push-notify.
registry:
  enabled: false
  localAddresses:
    - "192.168.200.3:5000"
    - "192.168.200.2:5000"  # legacy alias — rewritten to primary
    - "registry.gt.lo:5000"  # DNS alias — rewritten to primary
