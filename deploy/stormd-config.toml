# stormd supervisor config for mkube container
# stormd is PID 1, mkube is a supervised child process

[general]
name = "kube.gt.lo"
log_dir = "/var/stormd/logs"

# Rotation bounds the log PVC at max_size_bytes * max_files per process.
# stormd's defaults (100 MB x 10 = 1 GB) let the 2026-08-27 incident log
# grow toward filling the volume; 25 MB x 4 caps mkube at 100 MB total,
# which with zap sampling upstream is days of history, not hours.
[log]
max_size_bytes = 26214400
max_files = 4

[api]
bind = "0.0.0.0:9080"

[ssh]
enabled = true
bind = "0.0.0.0:22"
host_key = "/var/stormd/host_key"
password = "stormd"

[stormlog.terminal]
rows = 50
cols = 200
scrollback = 10000

[[process]]
name = "mkube"
command = "/mkube"
args = ["--config", "/etc/mkube/config.yaml"]
on_failure = "restart"
restart_delay_secs = 10
max_restarts = 100
restart_window_secs = 3600

[process.liveness]
type = "http"
url = "http://localhost:8082/healthz"
interval_secs = 10
failure_threshold = 3
# Boot must survive a fleet-wide DNS outage. Discovery alone takes ~40s, and
# with every microdns endpoint dead each DNS-zone ensure eats a ~3s dial
# timeout before /healthz ever starts serving — with a 30s delay stormd killed
# mkube at ~45s on every boot, which turned a DNS outage into a control-plane
# crash loop that could never recreate the DNS pods (observed 2026-08-09,
# 200+ consecutive crashes). The real fix is serving /healthz before the slow
# boot phases; until then the grace period must cover a worst-case boot.
initial_delay_secs = 240

[process.ui]
label = "Management"
proxy = "http://127.0.0.1:8082/ui/"
