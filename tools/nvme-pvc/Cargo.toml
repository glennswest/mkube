[package]
name = "nvme-pvc"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
byteorder = "1"
async-trait = "0.1"

[profile.release]
# Strip here rather than shelling out to a cross `strip` after the build.
# The Makefile used to call `aarch64-linux-musl-strip`, which meant the build
# box needed an aarch64-musl binutils on PATH on top of the C toolchain — one
# more thing to install before mkube could be deployed. Cargo does it during
# the build, on any host.
strip = true
